name: Refresh data

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC (default branch only)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated county subset for a quick test (blank = all)"
        required: false
      period_start:
        description: "YYYY-MM-DD (blank = 24 months back)"
        required: false
      period_end:
        description: "YYYY-MM-DD (blank = yesterday)"
        required: false
  push:
    branches: ["claude/**"]
    paths: ["build.mjs", "build/**", "lib/**", "data/regions.json", ".github/workflows/data.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
          ZAPIER_DIGEST_WEBHOOK: ${{ secrets.ZAPIER_DIGEST_WEBHOOK }}
          ONLY: ${{ inputs.only }}
          PERIOD_START: ${{ inputs.period_start }}
          PERIOD_END: ${{ inputs.period_end }}
        run: node build.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
