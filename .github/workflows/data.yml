name: Refresh data

on:
  schedule:
    - cron: "17 9 * * *" # nightly 09:17 UTC = 4:17am Central (default branch only)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated county subset for a quick test (blank = all)"
        required: false
      period_start:
        description: "YYYY-MM-DD (blank = 24 months back)"
        required: false
      period_end:
        description: "YYYY-MM-DD (blank = yesterday)"
        required: false

permissions:
  contents: write
  id-token: write # GitHub OIDC: lets the site's /api/pipeline-ai do AI tagging with the key stored in Vercel

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: Production # the secrets live in this GitHub environment
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || 'https://fs-real-estate-intelligence.vercel.app/api/pipeline-ai' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
          OPENAI_ENRICH_MODEL: ${{ vars.OPENAI_ENRICH_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
          ZAPIER_DIGEST_WEBHOOK: ${{ secrets.ZAPIER_DIGEST_WEBHOOK }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ONLY: ${{ inputs.only }}
          PERIOD_START: ${{ inputs.period_start }}
          PERIOD_END: ${{ inputs.period_end }}
        run: node build.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          # This commit only touches data/. If someone pushed data/ meanwhile, this run's freshly built files win
          # (-X theirs = the commit being replayed), so hours of geocoding are never thrown away over a conflict.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
