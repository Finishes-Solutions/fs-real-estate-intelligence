name: Refresh data

on:
  schedule:
    - cron: "17 9 * * *" # nightly 09:17 UTC = 4:17am Central (default branch only)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated county subset for a quick test (blank = all)"
        required: false
      period_start:
        description: "YYYY-MM-DD (blank = 24 months back)"
        required: false
      period_end:
        description: "YYYY-MM-DD (blank = yesterday)"
        required: false
      markets_only:
        description: "yes = only refresh data/markets.json (stocks, crypto, commodities, Houston metro series)"
        required: false

permissions:
  contents: write # push the data branch (main itself requires a pull request; see "Publish data")
  pull-requests: write # open / update the data pull request (also needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests")
  id-token: write # GitHub OIDC: lets the site's /api/pipeline-ai do AI tagging with the key stored in Vercel

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: Production # the secrets live in this GitHub environment
    timeout-minutes: 340
    steps:
      # the branch tip when the job starts, not when it was queued: a run that waited behind another one then
      # starts from that run's committed caches instead of redoing hours of geocoding
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || 'https://fs-real-estate-intelligence.vercel.app/api/pipeline-ai' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
          OPENAI_ENRICH_MODEL: ${{ vars.OPENAI_ENRICH_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
          ZAPIER_DIGEST_WEBHOOK: ${{ secrets.ZAPIER_DIGEST_WEBHOOK }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ONLY: ${{ inputs.only }}
          PERIOD_START: ${{ inputs.period_start }}
          PERIOD_END: ${{ inputs.period_end }}
        run: node build.mjs ${{ inputs.markets_only == 'yes' && '--markets' || '' }}
      # the build's outputs, kept a week even if publishing fails (no secrets in data/; the caches are what cost hours)
      - name: Keep the built files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: |
            data/*.json
            data/cache/*.json
          retention-days: 7
          if-no-files-found: error
      # main only takes changes through a pull request (GH006), so the run commits to the data branch and keeps one
      # pull request open for it (scripts/publish-data.sh): created the first night, updated every night after, never two.
      # The GITHUB_TOKEN cannot bypass the rule, and events it causes (the branch push, the pull request) start no other
      # workflows, which is fine: nothing here runs on push or pull_request. Vercel deploys from its own GitHub app when
      # the pull request is merged. Set the repository variable DATA_PR_AUTO_MERGE=true to have the run request auto-merge.
      - name: Publish data (data branch + pull request)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTO_MERGE: ${{ vars.DATA_PR_AUTO_MERGE }}
        run: bash scripts/publish-data.sh
