name: Probe services
# Manual diagnostics for external data services (parcel query shapes and speed).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Probe to run: parcels, height, news, geocode or bls"
        required: false
        default: parcels
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node build/probe-${{ inputs.script || 'parcels' }}.mjs
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
