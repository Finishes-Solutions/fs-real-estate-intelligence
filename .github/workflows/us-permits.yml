name: US permits (Supabase)

# Building permits from public open-data portals nationwide into Supabase dev_items (build/permits-us.mjs; sources in
# data/permit-sources.json). Nightly: the last 45 days of every source, in four parallel jobs. Run it by hand with no
# window for a full load (first time, or to catch up), optionally for a few sources only.
on:
  # every 3 hours with AUTO=1: full loads where none finished yet (a 6-hour job that stops is picked up by the next),
  # then each source refreshes once a day on its own
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Sources (slugs, comma separated; blank = all)"
        required: false
      since_days:
        description: "Only permits from the last N days (blank = everything: a full load)"
        required: false
      max_rows:
        description: "Stop each source after N rows (tests; blank = no limit)"
        required: false
      dry:
        description: "Read and map only, write nothing (1 = yes)"
        required: false
      auto:
        description: "1 = like the schedule: full loads only where none finished, else refresh (blank = everything now)"
        required: false
      geocode_max:
        description: "Rows without a point to place by address per source (blank = 50000; 0 = none)"
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: us-permits
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Load permits into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ytsxkipkobvcgysylfzc.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ONLY: ${{ inputs.only }}
          SHARD: ${{ inputs.only && '0/1' || format('{0}/4', matrix.shard) }}
          SINCE_DAYS: ${{ inputs.since_days }}
          MAX_ROWS: ${{ inputs.max_rows }}
          DRY: ${{ inputs.dry }}
          AUTO: ${{ github.event_name == 'schedule' && '1' || inputs.auto }}
          GEOCODE_MAX: ${{ inputs.geocode_max }}
        run: |
          if [ -n "$ONLY" ] && [ "${{ matrix.shard }}" != "0" ]; then echo "ONLY set: shard 0 does the work"; exit 0; fi
          node --max-old-space-size=6144 build/permits-us.mjs
